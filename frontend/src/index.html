<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <title>Iniciar sesión | FerroAdmin</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <main class="app">
      <h1>FerroAdmin</h1>
      <p>Gestión de inventario para ferretería</p>

     <div id="vista"></div>

      <main class="auth-panel">
        <div class="auth-columna">
          <div class="auth-formulario">
            <h1>Iniciar sesión</h1>
            <p class="auth-subtitulo">Ingresa para gestionar tu inventario.</p>

            <form id="form-login" novalidate>
              <div class="campo">
                <label for="email">Correo electrónico</label>
                <div class="campo-control">
                  <svg class="icono" aria-hidden="true" focusable="false"><use href="/iconos.svg#i-correo" /></svg>
                  <input type="email" id="email" name="email" autocomplete="email" placeholder="tu@ferreteria.co" required />
                </div>
                <p class="error" id="error-email" aria-live="polite"></p>
              </div>

              <div class="campo">
                <label for="password">Clave</label>
                <div class="campo-control">
                  <svg class="icono" aria-hidden="true" focusable="false"><use href="/iconos.svg#i-candado" /></svg>
                  <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
                </div>
                <p class="error" id="error-password" aria-live="polite"></p>
              </div>

              <!-- Aquí irá el CAPTCHA (T07) -->

              <button type="submit" class="btn btn-primario btn-grande btn-bloque">
                Entrar
                <svg class="icono" aria-hidden="true" focusable="false"><use href="/iconos.svg#i-flecha" /></svg>
              </button>
              <p class="error" id="error-general" aria-live="polite"></p>
            </form>

            <p class="auth-alterno">¿No tienes cuenta? <a href="/registro.html">Registrar</a></p>
            <p id="api-status" class="estado" role="status">Comprobando conexión con el servidor...</p>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
